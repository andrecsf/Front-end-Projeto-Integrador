<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Cursos | Sistema Acadêmico</title>
    <link rel="stylesheet" href="gerenciaCursos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-bars"></i>
                <span class="menu-text">Menu</span>
            </div>

            <nav class="sidebar-nav">
                <ul>
                    <li><a href="#"><i class="fas fa-home"></i> <span class="menu-text">Início</span></a></li>
                    <li><a href="#"><i class="fas fa-user"></i> <span class="menu-text">Perfil</span></a></li>
                    <li class="active"><a href="#"><i class="fas fa-chart-bar"></i> <span class="menu-text">Gerenciar cursos</span></a></li>
                    <li><a href="#"><i class="fas fa-users"></i> <span class="menu-text">Usuários</span></a></li>
                    <li><a href="#"><i class="fas fa-file-alt"></i> <span class="menu-text">Documentos</span></a></li>
                    <li><a href="#"><i class="fas fa-cog"></i> <span class="menu-text">Configurações</span></a></li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <div class="user-text">
                        <p class="menu-text">Administrador</p>
                        <a href="#" class="menu-text">Logout</a>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="main-header">
                <div class="header-left">
                    <i class="fas fa-arrow-left" id="btnVoltar" title="Voltar para Home"></i>
                    <h1>Gerenciar Cursos</h1>
                </div>
            </header>

            <section class="content-body">
                <!-- Estatísticas Dinâmicas -->
                <div class="stats-container">
                    <div class="stat-card">
                        <h2 id="total-courses">0</h2>
                        <p>Total de Cursos</p>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-card">
                        <h2 id="active-courses" class="text-green">0</h2>
                        <p>Cursos Ativos</p>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-card">
                        <h2 id="total-students" class="text-orange">0</h2>
                        <p>Total Alunos</p>
                    </div>
                </div>

                <!-- Barra de Busca e Ações -->
                <div class="actions-container">
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search-input" placeholder="Buscar por nome do curso...">
                    </div>

                    <button class="btn-add" onclick="window.location.href='../CadastrarCurso/cadastroCurso.html'">
                        <i class="fas fa-plus"></i> Cadastrar Novo Curso
                    </button>
                </div>

                <!-- Container onde o JS injetará os Cards -->
                <div id="course-list" class="course-list">
                    <div class="loading-state">
                        <p><i class="fas fa-spinner fa-spin"></i> Carregando cursos...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="gerenciarCursos.js"></script>
</body>
</html>
