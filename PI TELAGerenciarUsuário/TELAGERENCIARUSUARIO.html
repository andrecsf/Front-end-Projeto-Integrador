<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários | Sistema Acadêmico</title>
    <link rel="stylesheet" href="../PI TELAGerenciarUsuário/TELASTYLE.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-bars"></i>
                <span class="menu-text">Menu</span>
            </div>

            <nav class="sidebar-nav">
                <ul>
                    <li><a href="..//HomeAdmin/home-super-admin.html"><i class="fas fa-home"></i> <span
                                class="menu-text">Início</span></a></li>
                    <li><a href="..//PerfilSuperadmin/dashboard-superadmin.html"><i class="fas fa-user"></i> <span
                                class="menu-text">Perfil</span></a></li>
                    <li><a href="..//GerenciarCurso/gerenciarCursos.html"><i class="fas fa-chart-bar"></i> <span
                                class="menu-text">Gerenciar
                                cursos</span></a></li>
                    <li><a href="..//PI TELAGerenciarUsuário/TELAGERENCIARUSUARIO.html"><i class="fas fa-users"></i>
                            <span class="menu-text">Usuários</span></a></li>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <div class="user-text">
                        <p class="menu-text">Administrador</p>
                        <a href="..//Login/index.html" class="menu-text">Logout</a>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <header class="main-header">
                <div class="header-left">
                    <i class="fas fa-arrow-left" id="btnVoltar" title="Voltar para Home"
                        onclick="window.location.href='../PerfilSuperadmin/dashboard-superadmin.html'"></i>
                    <h1>Gerenciar Usuários</h1>
                </div>
            </header>

            <section class="content-body">

                <!-- Estatísticas -->
                <div class="stats-container">
                    <div class="stat-card">
                        <h2 id="stat-total">0</h2>
                        <p>Total de Usuários</p>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-card">
                        <h2 id="stat-alunos" class="text-green">0</h2>
                        <p>Alunos</p>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-card">
                        <h2 id="stat-coords" class="text-orange">0</h2>
                        <p>Coordenadores</p>
                    </div>
                </div>

                <!-- Busca, Filtros e Botões de Cadastro -->
                <div class="actions-container">
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search-input" placeholder="Buscar por nome do usuário...">
                    </div>

                    <div class="filter-bar">
                        <span class="filter-label">Filtrar por:</span>
                        <button class="filter-btn active" data-filter="todos">Todos</button>
                        <button class="filter-btn" data-filter="aluno">Alunos</button>
                        <button class="filter-btn" data-filter="coordenador">Coordenadores</button>
                    </div>

                    <div class="add-buttons">
                        <button class="btn-add btn-add-aluno" id="btnNovoAluno">
                            <i class="fas fa-user-plus"></i> Novo Aluno
                        </button>
                        <button class="btn-add btn-add-coord" id="btnNovoCoordenador">
                            <i class="fas fa-user-tie"></i> Novo Coordenador
                        </button>
                    </div>
                </div>

                <!-- Lista de Usuários -->
                <div id="user-list" class="user-list"></div>

            </section>
        </main>
    </div>

    <!-- Modal de Confirmação de Exclusão -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-icon"><i class="fas fa-exclamation-triangle"></i></div>
            <h3>Excluir Usuário</h3>
            <p id="modal-message">Tem certeza que deseja excluir este usuário?</p>
            <div class="modal-actions">
                <button class="btn-cancel" id="btnCancelar">Cancelar</button>
                <button class="btn-confirm" id="btnConfirmar">Excluir</button>
            </div>
        </div>
    </div>

    <script src="../PI TELAGerenciarUsuário/TELAGERENCIARUSUSARIO.js"></script>
</body>

</html>
