<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Senac</title>
    
    <!-- Estilos -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- PWA: Manifest e Ícone -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/launchericon-72x72.png">
    
    <!-- Android: Cor da barra de navegação/status -->
    <meta name="theme-color" content="#003a8f">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- iOS (Safari): Tags específicas para funcionar como App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Atividades">
    <link rel="apple-touch-icon" href="icons/launchericon-192x192.png">

    <!-- SEO / Descrição (Opcional, mas recomendado) -->
    <meta name="description" content="Sistema de Atividades Extracurriculares - Senac">
</head>

<body>
    <div class="background-overlay">
        <div class="login-container">
            <header>
                <img src="https://www.sp.senac.br/o/senac-theme/images/logo_senac_default.png" alt="Logo Senac"
                    class="logo">
                <h1>Bem-vindo</h1>
                <p>Faça login para ter acesso à sua conta.</p>
            </header>

            <div class="profile-selector">
                <button class="profile-card" onclick="selectProfile('admin')">
                    <span class="icon">👑</span>
                    <strong>Super Admin</strong>
                </button>
                <button class="profile-card" onclick="selectProfile('coordenador')">
                    <span class="icon">👨‍🏫</span>
                    <strong>Coordenador</strong>
                </button>
                <button class="profile-card active" onclick="selectProfile('aluno')">
                    <span class="icon">🎓</span>
                    <strong>Aluno</strong>
                </button>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <input type="email" placeholder="Informe seu e-mail *" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Informe sua senha *" required>
                </div>
                <button type="submit" class="btn-entrar">ENTRAR</button>
            </form>

            <footer>
                <p>Dúvidas? <strong>0800 000 000</strong></p>
                <p>Sistema de Gestão Acadêmica © 2026</p>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>

    <script>
    if ('serviceWorker' in navigator) {
        // O caminho deve apontar para a raiz do projeto
        navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
            .then((registration) => {
                console.log('Service Worker registrado com sucesso no escopo:', registration.scope);
            })
            .catch(err => {
                console.error('Erro ao registrar SW:', err);
            });
    }
</script>
</body>

</html>
