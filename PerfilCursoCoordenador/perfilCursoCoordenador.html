<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Cursos | Coordenador</title>
    <!-- CSS da Amiga (Base) e CSS Específico -->
    <link rel="stylesheet" href="../Telainicial/telaInicial.css">
    <link rel="stylesheet" href="gerenciarCursoCoordenador.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="menu-overlay" id="menuOverlay"></div>

    <div class="container">
        <!-- SIDEBAR COORDENADOR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header" id="sidebarToggle">
                <i class="fa-solid fa-bars"></i>
                <span class="menu-text">Menu</span>
            </div>
            <nav class="side-nav">
                <ul>
                    <li>
                        <a href="../Telainicial/telaInicial.html">
                            <i class="fa-solid fa-house"></i>
                            <span class="nav-text">Início</span>
                        </a>
                    </li>
                    <li>
                        <a href="../PerfilCoordenador/perfil-coordenador.html">
                            <i class="fa-regular fa-user"></i>
                            <span class="nav-text">Perfil</span>
                        </a>
                    </li>
                    <li class="active">
                        <a href="#">
                            <i class="fa-solid fa-graduation-cap"></i>
                            <span class="nav-text">Gerenciar curso</span>
                        </a>
                    </li>
                    <li>
                        <a href="../RelatoriosDosAlunos/relatoriosDosAlunos.html">
                            <i class="fa-solid fa-chart-simple"></i>
                            <span class="nav-text">Relatório</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="footer-user">
                    <i class="fa-regular fa-user fa-2x"></i>
                    <div class="footer-text">
                        <strong>Coordenador</strong>
                        <span><a href="../Login/index.html">logout</a></span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="main-content" id="mainContent">
            <header class="top-header">
                <div class="header-navigation">
                    <button id="btnVoltar" class="back-button">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <h1>Gerenciar Cursos da Coordenação</h1>
                </div>
            </header>

            <div class="content-padding">
                <!-- Resumo Simples -->
                <section class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-info">
                            <span class="stat-label">Meus Cursos</span>
                            <span class="stat-number" id="total-courses">0</span>
                        </div>
                        <div class="stat-icon icon-blue">
                            <i class="fa-solid fa-book"></i>
                        </div>
                    </div>
                </section>

                <!-- Área de Busca -->
                <section class="search-section">
                    <div class="search-bar">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search-input" placeholder="Filtrar cursos...">
                    </div>
                </section>

                <!-- Lista de Cursos -->
                <section class="course-grid" id="course-list">
                    <!-- Gerado via JS -->
                </section>
            </div>
        </main>
    </div>

    <script src="gerenciarCursoCoordenador.js"></script>
</body>

</html>
