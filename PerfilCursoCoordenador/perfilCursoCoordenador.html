<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Curso | Coordenador</title>
    <link rel="stylesheet" href="../Telainicial/telaInicial.css">
    <link rel="stylesheet" href="../PerfilCursoCoordenador/perfilCursoCoordenador.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="menu-overlay" id="menuOverlay"></div>

    <div class="container">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header" id="sidebarToggle">
                <i class="fa-solid fa-bars"></i>
                <span class="menu-text">Menu</span>
            </div>
            <nav class="side-nav">
                <ul>
                    <li>
                        <a href="../Telainicial/telaInicial.html">
                            <i class="fa-solid fa-house"></i>
                            <span class="nav-text">Início</span>
                        </a>
                    </li>
                    <li>
                        <a href="../PerfilCoordenador/perfil-coordenador.html">
                            <i class="fa-regular fa-user"></i>
                            <span class="nav-text">Perfil</span>
                        </a>
                    </li>
                    <li class="active">
                        <a href="../GerenciarCursoCoordenador/gerenciarCursoCoordenador.html">
                            <i class="fa-solid fa-graduation-cap"></i>
                            <span class="nav-text">Gerenciar curso</span>
                        </a>
                    </li>
                    <li>
                        <a href="../RelatoriosDosAlunos/relatoriosDosAlunos.html">
                            <i class="fa-solid fa-chart-simple"></i>
                            <span class="nav-text">Relatório</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="footer-user">
                    <i class="fa-regular fa-user fa-2x"></i>
                    <div class="footer-text">
                        <strong>Coordenador</strong>
                        <span><a href="../Login/index.html">logout</a></span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="main-content" id="mainContent">
            <header class="top-header">
                <div class="header-navigation">
                    <button id="btnVoltar" class="back-button">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <h1>Perfil do Curso</h1>
                </div>
            </header>

            <div class="content-padding">

                <!-- Dados do Curso -->
                <section class="course-info-card">
                    <div class="course-info-header">
                        <i class="fa-solid fa-graduation-cap"></i>
                        <div>
                            <h2 id="course-name">Carregando...</h2>
                            <p id="course-description">—</p>
                        </div>
                    </div>
                    <div class="course-info-meta">
                        <span>
                            <i class="fa-solid fa-clock"></i>
                            Carga horária: <strong id="course-workload">—</strong>
                        </span>
                        <span class="badge-active">Ativo</span>
                    </div>
                </section>

                <!-- Alunos Vinculados -->
                <section class="students-section">
                    <div class="students-header">
                        <h3>
                            <i class="fa-solid fa-users"></i>
                            Alunos vinculados
                            <span class="badge-count" id="students-count">0</span>
                        </h3>
                        <button id="btn-add-student" class="btn-primary">
                            <i class="fa-solid fa-plus"></i> Vincular aluno
                        </button>
                    </div>

                    <!-- Busca de alunos -->
                    <div class="search-bar">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search-student" placeholder="Buscar aluno...">
                    </div>

                    <!-- Lista de alunos -->
                    <div id="students-list">
                        <div class="empty-state">
                            <p>Nenhum aluno vinculado a este curso.</p>
                        </div>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <script src="perfilCursoCoordenador.js"></script>
</body>

</html>
