<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Categoria</title>
    <link rel="stylesheet" href="cadastrarCategoria.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="container">

        <!-- Main Content -->
        <main class="main-content" id="main-content">
            <header class="main-header">
                <div class="header-left">
                    <button class="btn-back" onclick="window.history.back()" title="Voltar">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <h1>Cadastrar Categoria</h1>
                </div>
            </header>

            <section class="content-body">
                <div class="form-container">
                    <h2>Categorias</h2>
                    <button class="btn-new" onclick="limparFormulario()">+ Cadastrar Nova Categoria</button>

                    <form id="categoriaForm">
                        <div class="form-group">
                            <label>Categoria (Área):</label>
                            <input type="text" id="area" placeholder="Digite aqui nova categoria" required>
                        </div>
                        <div class="form-group">
                            <label>Limite de Submissões Semestre:</label>
                            <input type="number" id="limiteSubmissoesSemestre" placeholder="Ex: 5" required>
                        </div>
                        <div class="form-group">
                            <label>Horas por Certificado:</label>
                            <input type="number" id="horasPorCertificado" placeholder="Ex: 20" required>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-save">Salvar</button>
                            <button type="button" class="btn-cancel" onclick="limparFormulario()">Cancelar</button>
                        </div>
                    </form>
                </div>

                <div class="list-container">
                    <h3>Categorias Cadastradas:</h3>
                    <div id="listaCategorias"></div>
                </div>
            </section>
        </main>

        <!-- Sidebar (Direita) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header" id="sidebar-header">
                <i class="fas fa-bars"></i>
                <span class="menu-text">Menu</span>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="#"><i class="fas fa-home"></i> <span class="menu-text">Início</span></a></li>
                    <li><a href="#"><i class="fas fa-user"></i> <span class="menu-text">Perfil</span></a></li>
                    <li><a href="gerenciarCursos.html"><i class="fas fa-chart-bar"></i> <span
                                class="menu-text">Gerenciar cursos</span></a></li>
                    <li><a href="#"><i class="fas fa-users"></i> <span class="menu-text">Usuários</span></a></li>
                    <li><a href="#"><i class="fas fa-file-alt"></i> <span class="menu-text">Documentos</span></a></li>
                    <li><a href="#"><i class="fas fa-cog"></i> <span class="menu-text">Configurações</span></a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <div class="user-text">
                        <p class="menu-text">Usuário</p>
                        <a href="#" class="menu-text">logout</a>
                    </div>
                </div>
            </div>
        </aside>

    </div>
    <script src="cadastrarCategoria.js"></script>
</body>

</html>
