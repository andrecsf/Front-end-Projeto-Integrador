<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validação de Certificado</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="estilo-validar.css" />
</head>

<body>

  <div class="app">

    <div class="main">
      <header class="topbar">

        <div class="topbar-left">
          <a href="../CoordenadorRelatorio/relatórioAluno.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
          </a>
          <h1 class="topbar-title">Validação de Certificado</h1>
        </div>

        <div class="topbar-right">
          <button class="bell-btn"><i class="fa-solid fa-bell"></i></button>
        </div>

      </header>

      <main class="content">

        <!-- PERFIL -->
        <section class="card profile-card">
          <div class="profile-row">
            <div class="avatar" id="avatar">--</div>
            <div class="profile-info">
              <p class="profile-name" id="profile-name">—</p>
              <p class="profile-sub" id="profile-sub">Horas complementares</p>
            </div>
          </div>

          <div class="progress-row">
            <span>Progresso</span>
            <div class="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span id="progress-pct">0%</span>
          </div>
        </section>

        <!-- INFO -->
        <section class="card info-card">
          <div class="card-header">
            <span class="card-icon"><i class="fa-solid fa-clipboard-list"></i></span>
            <h2>Informações do Aluno</h2>
          </div>

          <dl class="info-grid">
            <dt>Nome</dt>
            <dd id="info-nome">—</dd>

            <dt>Atividade</dt>
            <dd id="info-atividade">—</dd>

            <dt>Categoria</dt>
            <dd id="info-categoria">—</dd>

            <dt>Data</dt>
            <dd id="info-data">—</dd>

            <dt>Carga Horária</dt>
            <dd id="info-carga">—</dd>
          </dl>
        </section>

        <!-- DOCUMENTO -->
        <section class="card doc-card">
          <div class="card-header">
            <span class="card-icon"><i class="fa-solid fa-paperclip"></i></span>
            <h2>Documento Anexado</h2>
          </div>

          <div class="doc-item">
            <div class="doc-thumb"><i class="fa-solid fa-file-pdf"></i></div>
            <div>
              <p id="doc-name">—</p>
            </div>
            <button class="doc-action" id="btnVer">Ver</button>
          </div>
        </section>

        <!-- JUSTIFICATIVA -->
        <section class="card">
          <label for="justificativa">
            Justificativa <span>(obrigatória se reprovar)</span>
          </label>
          <textarea id="justificativa" disabled></textarea>
        </section>

        <!-- AÇÕES -->
        <div class="actions">
          <button class="btn btn-approve" id="btn-approve">Aprovar</button>
          <button class="btn btn-reject" id="btn-reject">Reprovar</button>
        </div>

      </main>
    </div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

      <div class="sidebar-header">
        <i class="fa-solid fa-bars"></i>
        <span class="menu-text">Menu</span>
      </div>

      <ul class="nav-list">
        <li class="nav-item active"><i class="fa-solid fa-house"></i><span class="nav-text">Início</span></li>
        <li class="nav-item"><i class="fa-solid fa-user"></i><span class="nav-text">Perfil</span></li>
        <li class="nav-item"><i class="fa-solid fa-chart-line"></i><span class="nav-text">Atividades</span></li>
        <li class="nav-item"><i class="fa-solid fa-file"></i><span class="nav-text">Documentos</span></li>
        <li class="nav-item"><i class="fa-solid fa-gear"></i><span class="nav-text">Configurações</span></li>
      </ul>

      <div class="sidebar-footer">
        <div class="footer-user">
          <i class="fa-solid fa-circle-user"></i>
          <div class="footer-text">
            <strong>Usuário</strong>
            <a href="../Login/index.html">Sair</a>
          </div>
        </div>
      </div>

    </aside>

  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modal-title">Confirmar</h2>
      <p id="modal-sub"></p>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="modal-cancel">Cancelar</button>
        <button class="btn btn-confirm" id="modal-confirm">Confirmar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="validar-certificado.js"></script>
</body>

</html>
