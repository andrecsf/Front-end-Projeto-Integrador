<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios de Alunos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="relatoriosDosAlunos.css">
</head>

<body>
    <div class="menu-overlay" id="menuOverlay"></div>

    <div class="container">
        <main class="main-content" id="mainContent">
            <header class="top-header">
                <div class="header-left">
                    <a href="..//TelaInicial/telaInicial.html" class="back-btn">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <h1>Relatórios de Alunos</h1>
                </div>
                <button class="menu-toggle" id="openMenu">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </header>

            <div class="content-padding">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Buscar aluno..." id="searchInput">
                </div>

                <div class="status-summary">
                    <div class="status-item">
                        <span class="status-count count-green">0</span>
                        <span class="status-label">Completos</span>
                    </div>
                    <div class="status-item">
                        <span class="status-count count-blue">0</span>
                        <span class="status-label">Em Progresso</span>
                    </div>
                    <div class="status-item">
                        <span class="status-count count-orange">0</span>
                        <span class="status-label">Atrasados</span>
                    </div>
                </div>

                <!-- Cards preenchidos dinamicamente pelo JS -->
                <div class="students-grid" id="studentsGrid"></div>
            </div>
        </main>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header" id="sidebarToggle">
                <i class="fa-solid fa-bars"></i>
                <span class="menu-text">Menu</span>
            </div>
            <nav class="side-nav">
                <ul>
                    <li>
                        <a href="..//TelaInicial/telaInicial.html">
                            <i class="fa-solid fa-house"></i>
                            <span class="nav-text">Início</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="fa-regular fa-user"></i>
                            <span class="nav-text">Perfil</span>
                        </a>
                    </li>
                    <li class="active">
                        <a href="..//RelatoriosDosAlunos/relatoriosDosAlunos.html">
                            <i class="fa-solid fa-chart-simple"></i>
                            <span class="nav-text">Relatório</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="fa-regular fa-file-lines"></i>
                            <span class="nav-text">Gerenciar curso</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="footer-user">
                    <i class="fa-regular fa-user fa-2x"></i>
                    <div class="footer-text">
                        <strong>Usuário</strong>
                        <span><a href="../Login/index.html">logout</a></span>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script src="realatoriosDosAlunos.js"></script>
</body>

</html>
