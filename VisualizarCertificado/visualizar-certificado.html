<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Certificado</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="estilo-visualizar.css">
</head>

<body>

    <div class="app-container">

        <!-- Main Content -->
        <main class="main-content" id="mainContent">

            <header>
                <div class="header-left">
                    <i class="fa-solid fa-arrow-left" onclick="handleExit()"></i>
                    <h2>Certificado do aluno <i class="fa-regular fa-bell" style="font-size: 0.9rem;"></i></h2>
                </div>
            </header>

            <div class="container">
                <div class="card">
                    <div class="doc-info">
                        <div class="doc-icon">
                            <i class="fa-regular fa-file-lines"></i>
                        </div>
                        <div class="doc-text">
                            <strong>Documento Anexado:</strong>
                            <span>João Silva</span>
                            <small>14/03/2026 • 20h</small>
                        </div>
                    </div>

                    <div class="pdf-viewer-container" id="pdfWrapper">
                        <button class="expand-btn" onclick="toggleExpand()">
                            <i class="fa-solid fa-maximize" id="expandIcon"></i>
                        </button>
                        <iframe src="" id="pdf-frame"></iframe>
                    </div>

                    <div class="footer-actions">
                        <button class="btn-sair" onclick="handleExit()">Sair</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Sidebar colapsável (igual telaInicial) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header" id="sidebarToggle">
                <i class="fa-solid fa-bars"></i>
                <span class="menu-text">Menu</span>
            </div>
            <ul class="nav-list">
                <li class="nav-item"><i class="fa-solid fa-house"></i> <span class="nav-text">Início</span></li>
                <li class="nav-item"><i class="fa-solid fa-user"></i> <span class="nav-text">Perfil</span></li>
                <li class="nav-item"><i class="fa-solid fa-chart-line"></i> <span class="nav-text">Atividades</span>
                </li>
                <li class="nav-item active"><i class="fa-solid fa-file"></i> <span class="nav-text">Documentos</span>
                </li>
                <li class="nav-item"><i class="fa-solid fa-gear"></i> <span class="nav-text">Configurações</span></li>
            </ul>
            <div class="sidebar-footer">
                <div class="user-info">
                    <i class="fa-solid fa-circle-user"></i>
                    <div class="user-text">
                        <span>João Silva</span>
                        <a href="#" class="logout-link" onclick="handleExit()">logout</a>
                    </div>
                </div>
            </div>
        </aside>

    </div>

    <script src="visualizar-certificado.js"></script>
</body>

</html>
